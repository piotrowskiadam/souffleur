name: Deploy extensions to web stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify credentials only, or submit a validated version to the stores
        type: choice
        options: [verify, publish]
        default: verify
      store:
        description: Store to operate on
        type: choice
        options: [both, chrome, firefox]
        default: both

permissions:
  contents: read

concurrency:
  group: extension-store-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.context.outputs.version }}
      operation: ${{ steps.context.outputs.operation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release tag and trusted ref
        id: context
        run: node scripts/release-context.js
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:ui
      - run: npm run package
      - run: npm run package:source
      - uses: actions/upload-artifact@v7
        with:
          name: store-packages
          path: artifacts/*.zip
          if-no-files-found: error

  chrome:
    needs: validate
    if: github.event_name == 'release' || inputs.store == 'both' || inputs.store == 'chrome'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check non-secret Google configuration
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          for name in GOOGLE_CLOUD_PROJECT GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_SERVICE_ACCOUNT CHROME_PUBLISHER_ID CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then echo "::error::Set repository Actions variable $name"; exit 1; fi
          done
      - uses: actions/download-artifact@v8
        with:
          name: store-packages
          path: artifacts
      - name: Authenticate with short-lived Google credentials
        id: google
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: ${{ needs.validate.outputs.operation == 'publish' && 'https://www.googleapis.com/auth/chromewebstore' || 'https://www.googleapis.com/auth/chromewebstore.readonly' }}
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify or publish with Chrome Web Store API v2
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          STORE_OPERATION: ${{ needs.validate.outputs.operation }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/chrome-store.js "$STORE_OPERATION" "artifacts/souffleur-chrome-$RELEASE_VERSION.zip"

  firefox:
    needs: validate
    if: github.event_name == 'release' || inputs.store == 'both' || inputs.store == 'firefox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: store-packages
          path: artifacts
      - name: Verify or publish the listed Firefox add-on, including reviewer source
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          STORE_OPERATION: ${{ needs.validate.outputs.operation }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/firefox-store.js "$STORE_OPERATION" "artifacts/souffleur-firefox-$RELEASE_VERSION.zip" "artifacts/souffleur-source-$RELEASE_VERSION.zip"
